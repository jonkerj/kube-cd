apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf3-exporter
  labels:
    app.kubernetes.io/instance: iperf3-exporter
    app.kubernetes.io/name: iperf3-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: iperf3-exporter
      app.kubernetes.io/name: iperf3-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: iperf3-exporter
        app.kubernetes.io/name: iperf3-exporter
    spec:
      serviceAccountName: iperf3-exporter
      automountServiceAccountToken: false
      containers:
      - name: iperf3-exporter
        image: ghcr.io/edgard/iperf3_exporter:1.3.1
        ports:
          - name: metrics
            containerPort: 9579
        startupProbe:
          httpGet:
            path: /health
            port: metrics
          periodSeconds: 1
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          periodSeconds: 10
          failureThreshold: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 32Mi
